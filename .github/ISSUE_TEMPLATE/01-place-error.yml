name: 🗺️ Place Data Error (GoGoPet / Locapeta)
description: Report inaccurate venue details on GoGoPet or Locapeta
title: "[Place Error] "
labels: ["data-error", "gogopet"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐕 Place Data Error Report

        Use this template to report inaccurate venue information collected by Bori.
        **Please do not include personal information (name, phone, address, email)** — all reports are public.

  - type: input
    id: place-name
    attributes:
      label: Place Name
      description: Name of the venue as shown on the site
      placeholder: e.g. Surfyy Beach Yangyang
    validations:
      required: true

  - type: input
    id: place-url
    attributes:
      label: Place Page URL
      description: URL of the venue page on GoGoPet or Locapeta
      placeholder: https://gogopet.kr/places/...
    validations:
      required: true

  - type: dropdown
    id: error-type
    attributes:
      label: Error Type
      multiple: true
      options:
        - Opening hours (incorrect or closed)
        - Pet policy (allowed / restricted mismatch)
        - Large dog policy
        - Phone number (incorrect or disconnected)
        - Address / map location
        - Name / category classification
        - Permanently closed or relocated
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe what is inaccurate and what the correct information is
      placeholder: |
        e.g. Opening hours are listed as 09:00-21:00, but updated hours are 10:00-18:00.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source (Optional)
      description: Official website, map listing, or direct visit details
      placeholder: e.g. Official website notice / direct visit
    validations:
      required: false
