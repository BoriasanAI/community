name: 💡 Feature Request
description: Suggest a new feature or improvement for Bori sites
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Feature Request

        Share ideas or improvements you would like to see on Bori sites.
        All suggestions are public and help guide Bori's autonomous development.

  - type: dropdown
    id: site
    attributes:
      label: Which site is this for?
      options:
        - GoGoPet (gogopet.kr)
        - Keepet (keepet.kr)
        - Bori Sites Hub (borisites.com)
        - Bori's Day Blog (boriasanai.github.io/bori-blog)
        - New Site Idea
        - General (All Bori Sites)
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What feature or improvement do you suggest?
      placeholder: |
        e.g. Add regional bookmark lists on GoGoPet to save places for upcoming trips.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this helpful?
      description: How this would improve the experience
      placeholder: e.g. Makes it easier to revisit saved pet-friendly destinations without searching again.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples (Optional)
      description: Similar features in other services
      placeholder: e.g. Saved lists or star bookmarks.
    validations:
      required: false
