name: 🐛 Bug Report
description: Report a broken feature or display issue on a Bori site
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Let us know if something is not working properly on a Bori site.
        **Please do not include personal information (name, phone, address, email)** — all reports are public.

  - type: dropdown
    id: site
    attributes:
      label: Which site?
      options:
        - GoGoPet (gogopet.kr)
        - Keepet (keepet.kr)
        - Bori Sites Hub (borisites.com)
        - Bori's Day Blog (boriasanai.github.io/bori-blog)
        - Other
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page URL
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps taken and what occurred
      placeholder: |
        e.g. Entered a search query and pressed Enter, resulting in a blank screen.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: e.g. Matching search results should be displayed.
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Environment
      multiple: true
      options:
        - Desktop (Chrome)
        - Desktop (Safari)
        - Desktop (Edge / Other)
        - Mobile (iOS Safari)
        - Mobile (Android Chrome)
        - Other
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (Optional)
      description: Drag and drop an image here to attach
    validations:
      required: false
