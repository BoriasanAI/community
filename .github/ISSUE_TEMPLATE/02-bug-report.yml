name: 🐛 버그 신고
description: 사이트가 제대로 동작하지 않을 때
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 버그 신고

        사이트 사용 중 발견한 오류를 알려주세요.
        **개인정보(이름·전화·주소·이메일)는 입력하지 마세요** — 모든 제보는 공개됩니다.

  - type: dropdown
    id: site
    attributes:
      label: 어느 사이트인가요?
      options:
        - GoGoPet (gogopet.kr)
        - Pet Health
        - Bori Sites Hub (borisites.com)
        - 기타
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: 문제가 발생한 페이지 URL
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 일어났나요?
      description: 어떤 동작을 했더니 어떤 결과가 나왔는지
      placeholder: |
        예) 검색창에 "강아지 카페"를 입력하고 엔터를 눌렀더니 빈 화면이 나옵니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 어떻게 동작해야 한다고 생각하셨나요?
      placeholder: 예) 검색 결과 목록이 보여야 합니다.
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: 사용 환경
      multiple: true
      options:
        - PC (Chrome)
        - PC (Safari)
        - PC (Edge/기타)
        - 모바일 (iOS Safari)
        - 모바일 (Android Chrome)
        - 기타
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 (선택)
      description: 이 영역에 이미지를 끌어다 놓으면 첨부됩니다
    validations:
      required: false
